# ===================================================================
# Smart E-Commerce JPA Application Configuration
# ===================================================================

# Spring Boot Configuration
spring:
  application:
    name: smart-ecommerce-jpa
  profiles:
    active: dev  # Use -Dspring.profiles.active=dev/test/prod
  
  # Database Configuration
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ecommerce_db_jpa}
    username: ${POSTGRES_USER:my_user}
    password: ${POSTGRES_PASSWORD:secret}
    driver-class-name: ${DATABASE_DRIVER:org.postgresql.Driver}
    hikari:
      pool-name: SmartEcommerceHikariPool
      maximum-pool-size: 20
      minimum-idle: 10
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
      leak-detection-threshold: 60000
      validation-timeout: 5000
    
  # JPA/Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: validate
      show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        
  # Flyway Database Migration
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true
    
  # Caching Configuration
  cache:
    type: caffeine
    caffeine:
      spec: maximum-size=5000,expire-after-write=30m
    cache-names: users,products,categories,orders,addresses,cart,reviews,payment_methods,shipping_method
    
  # Server Configuration
  server:
    port: 8080

# Management/Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,caches
  endpoint:
    health:
      show-details: always
    info:
      env:
        enabled: true
  simple:
    metrics:
      export:
        enabled: true

# Logging Configuration
logging:
  level:
    com.miracle.smart_ecommerce_jpa: DEBUG
    org.springframework.cache: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# ===================================================================
# Profile-Specific Configurations
# ===================================================================

# Development Profile (with data seeding)
---
spring:
  config:
    activate:
      on-profile: dev
  logging:
    level:
      root: INFO

# Test Profile (verification only)
---
spring:
  config:
    activate:
      on-profile: test
  logging:
    level:
      root: WARN

# Production Profile (no seeding)
---
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    show-sql: false
  logging:
    level:
      root: ERROR
      com.miracle.smart_ecommerce_jpa: INFO
